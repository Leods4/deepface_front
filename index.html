<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Biométrico Multimodal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <style>
        :root {
            /* Paleta de Cores Moderna */
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --primary-color: #3b82f6; /* Azul moderno */
            --primary-hover: #2563eb;
            --success-color: #10b981; /* Verde esmeralda */
            --success-hover: #059669;
            --analyze-color: #8b5cf6; /* Roxo vibrante para análise */
            --analyze-hover: #7c3aed;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-soft: 0 10px 40px -10px rgba(0,0,0,0.08);
            --shadow-hover: 0 14px 45px -10px rgba(0,0,0,0.12);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-container {
            background-color: var(--card-bg);
            max-width: 750px;
            width: 100%;
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
        }

        h1 {
            margin-top: 0;
            color: #0f172a;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 15px;
            line-height: 1.5;
        }

        .seletor-container {
            margin-bottom: 25px;
            background-color: #f8fafc;
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: auto;
        }

        .seletor-container label {
            font-weight: 600;
            color: var(--text-main);
            font-size: 14px;
        }

        #selectTipo {
            padding: 10px 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: white;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #selectTipo:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .botoes-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        #previewContainer {
            margin: 25px 0;
            min-height: 140px;
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            align-items: center;
            gap: 15px; 
            border: 2px dashed #94a3b8;
            border-radius: var(--radius-md);
            padding: 25px;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        #previewContainer:hover {
            border-color: var(--primary-color);
            background-color: #f1f5f9;
        }

        #textoPreview {
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
        }

        .preview-wrapper {
            position: relative;
            display: inline-block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .preview-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 3px solid white;
        }

        .btn-remover {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.3);
            transition: all 0.2s ease;
        }

        .btn-remover:hover {
            transform: scale(1.15);
            background-color: #dc2626;
        }

        button {
            padding: 12px 24px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            transform: translateY(2px);
        }

        button:disabled {
            background-color: #e2e8f0 !important;
            color: #94a3b8 !important;
            cursor: not-allowed;
            transform: none;
            box-shadow: none !important;
        }

        .btn-estilizado, .btn-primario {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .btn-estilizado:hover:not(:disabled), .btn-primario:hover:not(:disabled) {
            background-color: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
            transform: translateY(-1px);
        }

        .btn-secundario {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-secundario:hover:not(:disabled) {
            background-color: #cbd5e1;
            color: #1e293b;
        }

        .acoes-container {
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background-color: white;
            padding: 30px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        #inputIdentificador {
            padding: 14px 20px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        #inputIdentificador:focus {
            border-color: var(--primary-color);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .botoes-acao {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-cadastrar {
            background-color: var(--success-color);
            color: white;
            flex: 1;
            min-width: 180px;
            max-width: 220px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-cadastrar:hover:not(:disabled) {
            background-color: var(--success-hover);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
        }

        .btn-analisar {
            background-color: var(--analyze-color);
            color: white;
            flex: 1;
            min-width: 180px;
            max-width: 220px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }

        .btn-analisar:hover:not(:disabled) {
            background-color: var(--analyze-hover);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35);
        }

        .card-hidden {
            display: none !important;
        }

        #cameraContainer {
            margin: 20px auto;
            border: 2px solid var(--primary-color);
            padding: 15px;
            border-radius: var(--radius-md);
            background-color: #f8fafc;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.15);
            animation: fadeIn 0.3s ease-out;
        }

        #videoElement {
            width: 100%;
            max-width: 450px;
            border-radius: 8px;
            background-color: #0f172a;
        }

        .camera-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        #resultado {
            margin-top: 30px;
            text-align: left; 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .loading-text {
            text-align: center;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 16px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .resultado-item {
            padding: 20px;
            border-radius: 12px;
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            font-size: 14px;
            line-height: 1.6;
            animation: fadeIn 0.4s ease-out;
            border-left: 6px solid transparent;
        }

        .resultado-header {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .highlight-text {
            background-color: #f1f5f9;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 15px;
            font-weight: bold;
            color: var(--primary-color);
            border: 1px solid #e2e8f0;
        }

        .sucesso { 
            border-left-color: var(--success-color); 
        }
        .sucesso .resultado-header { color: var(--success-color); }

        .falha { 
            border-left-color: #f59e0b; 
        }
        .falha .resultado-header { color: #d97706; }

        .erro { 
            border-left-color: #ef4444; 
        }
        .erro .resultado-header { color: #dc2626; }

        /* Estilos da Janela Modal de Recorte */
        .cropper-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .cropper-modal-content {
            background-color: #fff;
            padding: 25px;
            border-radius: var(--radius-lg);
            max-width: 550px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.3s ease-out;
        }

        .cropper-modal-header {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
            text-align: left;
        }

        .cropper-area-wrapper {
            width: 100%;
            height: 350px;
            background-color: #f1f5f9;
            overflow: hidden;
            border-radius: var(--radius-md);
            border: 2px solid #e2e8f0;
        }

        .cropper-area-wrapper img {
            max-width: 100%;
            display: block;
        }

        .cropper-modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        
        /* Ajuste para dispositivos móveis */
        @media (max-width: 600px) {
            .main-container { padding: 25px 20px; }
            .botoes-acao { flex-direction: column; }
            .btn-cadastrar, .btn-analisar { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>Reconhecimento Biométrico</h1>
        <p class="subtitle">Cadastre e identifique rostos ou tatuagens. Selecione ou tire fotos de até 5 imagens (JPG, PNG).</p>
        
        <div class="seletor-container">
            <label for="selectTipo">Tipo de Elemento:</label>
            <select id="selectTipo">
                <option value="rosto">👤 Rosto Humano</option>
                <option value="tatuagem">🎨 Tatuagem / Padrão</option>
            </select>
        </div>

        <input type="file" id="imagemInput" accept=".jpg, .jpeg, .png" multiple style="display: none;">
        
        <div class="botoes-container">
            <button class="btn-estilizado" onclick="document.getElementById('imagemInput').click()">
                📁 Escolher Arquivos
            </button>
            <button id="btnAbrirCamera" class="btn-estilizado">
                📷 Usar Câmera
            </button>
        </div>

        <div id="cameraContainer" class="card-hidden">
            <video id="videoElement" autoplay playsinline></video>
            <div class="camera-actions">
                <button id="btnCapturar" class="btn-primario">📸 Tirar Foto</button>
                <button id="btnFecharCamera" class="btn-secundario">Cancelar</button>
            </div>
            <canvas id="canvasElement" style="display: none;"></canvas>
        </div>
        
        <div id="previewContainer">
            <span id="textoPreview">Nenhuma imagem selecionada</span>
        </div>
        
        <div class="acoes-container">
            <input type="text" id="inputIdentificador" placeholder="Nome sem espaços (ex: joao_silva)">
            <div class="botoes-acao">
                <button id="btnCadastrar" class="btn-cadastrar">➕ Cadastrar Imagem</button>
                <button id="btnAnalisar" class="btn-analisar">🔍 Reconhecer Imagem</button>
            </div>
        </div>

        <div id="resultado"></div>
    </div>

    <div id="cropperModal" class="cropper-modal-overlay">
        <div class="cropper-modal-content">
            <p class="cropper-modal-header">Recortar Região de Interesse</p>
            <small style="color: var(--text-muted); text-align: left; margin-top: -10px;">
                Isole a tatuagem ou o rosto eliminando o fundo para melhor assertividade do algoritmo.
            </small>
            <div class="cropper-area-wrapper">
                <img id="cropperImage" src="" alt="Imagem para recortar">
            </div>
            <div class="cropper-modal-actions">
                <button id="btnCancelarRecorte" class="btn-secundario" style="padding: 10px 16px; font-size: 14px;">Ignorar / Cancelar</button>
                <button id="btnConfirmarRecorte" class="btn-primario" style="padding: 10px 16px; font-size: 14px;">Confirmar Recorte</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script>
        // Mantenha seu link ngrok aqui
        const BASE_URL = 'https://panoramic-figure-mushroom.ngrok-free.dev';

        const imagemInput = document.getElementById('imagemInput');
        const previewContainer = document.getElementById('previewContainer');
        const btnAnalisar = document.getElementById('btnAnalisar');
        const btnCadastrar = document.getElementById('btnCadastrar');
        const inputIdentificador = document.getElementById('inputIdentificador');
        const resultadoContainer = document.getElementById('resultado');
        const selectTipo = document.getElementById('selectTipo');

        const cameraContainer = document.getElementById('cameraContainer');
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('canvasElement');
        const btnAbrirCamera = document.getElementById('btnAbrirCamera');
        const btnCapturar = document.getElementById('btnCapturar');
        const btnFecharCamera = document.getElementById('btnFecharCamera');

        const cropperModal = document.getElementById('cropperModal');
        const cropperImage = document.getElementById('cropperImage');
        const btnCancelarRecorte = document.getElementById('btnCancelarRecorte');
        const btnConfirmarRecorte = document.getElementById('btnConfirmarRecorte');

        let imagensSelecionadas = [];
        let filaArquivosParaCortar = [];
        let arquivoAtualSendoCortado = null;
        let cropperInstance = null;
        let streamDeVideo = null;
        const LIMITE_IMAGENS = 5;

        imagemInput.addEventListener('change', (evento) => {
            const arquivosPermitidos = Array.from(evento.target.files).filter(file => 
                ['image/jpeg', 'image/jpg', 'image/png'].includes(file.type)
            );
            
            if (arquivosPermitidos.length < evento.target.files.length) {
                alert("Alguns arquivos foram ignorados. Envie apenas formatos JPG, JPEG ou PNG.");
            }

            adicionarImagensFila(arquivosPermitidos);
            imagemInput.value = ''; 
        });

        function adicionarImagensFila(novosArquivos) {
            if (imagensSelecionadas.length + novosArquivos.length > LIMITE_IMAGENS) {
                alert(`Conforme documentação da API, o limite é de ${LIMITE_IMAGENS} imagens por requisição.`);
                const vagasRestantes = LIMITE_IMAGENS - imagensSelecionadas.length;
                novosArquivos = novosArquivos.slice(0, vagasRestantes);
            }
            filaArquivosParaCortar = [...filaArquivosParaCortar, ...novosArquivos];
            processarProximaImagemFila();
        }

        function processarProximaImagemFila() {
            if (filaArquivosParaCortar.length === 0) return;

            if (imagensSelecionadas.length >= LIMITE_IMAGENS) {
                filaArquivosParaCortar = [];
                return;
            }

            arquivoAtualSendoCortado = filaArquivosParaCortar.shift();
            const urlTemporaria = URL.createObjectURL(arquivoAtualSendoCortado);
            
            cropperImage.onload = () => {
                if (cropperInstance) cropperInstance.destroy();
                
                cropperInstance = new Cropper(cropperImage, {
                    viewMode: 1,
                    autoCropArea: 0.85,
                    responsive: true,
                    restore: false,
                    checkCrossOrigin: false,
                    aspectRatio: NaN
                });
            };

            cropperImage.src = urlTemporaria;
            cropperModal.style.display = 'flex';
        }

        btnConfirmarRecorte.addEventListener('click', () => {
            if (!cropperInstance) return;

            const canvasCortado = cropperInstance.getCroppedCanvas({
                maxWidth: 1024,
                maxHeight: 1024
            });

            canvasCortado.toBlob((blob) => {
                const nomeFinal = `recortado_${Date.now()}_${arquivoAtualSendoCortado.name || 'foto.jpg'}`;
                const arquivoRecortado = new File([blob], nomeFinal, { type: 'image/jpeg' });
                
                imagensSelecionadas.push(arquivoRecortado);
                atualizarInterface();
                fecharModalRecorte();
                processarProximaImagemFila();
            }, 'image/jpeg', 0.9);
        });

        btnCancelarRecorte.addEventListener('click', () => {
            fecharModalRecorte();
            processarProximaImagemFila();
        });

        function fecharModalRecorte() {
            cropperModal.style.display = 'none';
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
            if (cropperImage.src) {
                URL.revokeObjectURL(cropperImage.src);
                cropperImage.src = '';
            }
            arquivoAtualSendoCortado = null;
        }

        if (btnAbrirCamera) {
            btnAbrirCamera.addEventListener('click', async () => {
                try {
                    streamDeVideo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    videoElement.srcObject = streamDeVideo;
                    cameraContainer.classList.remove('card-hidden');
                    btnAbrirCamera.disabled = true;
                } catch (erro) {
                    alert("Erro ao acessar a câmera. Verifique as permissões do navegador.");
                    console.error(erro);
                }
            });
        }

        if (btnFecharCamera) {
            btnFecharCamera.addEventListener('click', fecharCamera);
        }

        function fecharCamera() {
            if (streamDeVideo) {
                streamDeVideo.getTracks().forEach(track => track.stop());
            }
            cameraContainer.classList.add('card-hidden');
            btnAbrirCamera.disabled = false;
        }

        if (btnCapturar) {
            btnCapturar.addEventListener('click', () => {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                const contexto = canvasElement.getContext('2d');
                contexto.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                
                canvasElement.toBlob((blob) => {
                    const arquivoCamera = new File([blob], `foto_camera_${Date.now()}.jpg`, { type: 'image/jpeg' });
                    adicionarImagensFila([arquivoCamera]);
                    fecharCamera();
                }, 'image/jpeg', 0.9);
            });
        }

        function atualizarInterface() {
            if (imagensSelecionadas.length === 0) {
                previewContainer.innerHTML = '<span id="textoPreview">Nenhuma imagem selecionada</span>';
                btnAnalisar.disabled = true;
                btnCadastrar.disabled = true;
                return;
            }

            btnAnalisar.disabled = false;
            btnCadastrar.disabled = false;
            previewContainer.innerHTML = ''; 
            
            imagensSelecionadas.forEach((arquivo, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'preview-wrapper';

                const img = document.createElement('img');
                img.src = URL.createObjectURL(arquivo);
                img.className = 'preview-img';

                const btnRemover = document.createElement('button');
                btnRemover.innerHTML = '✕';
                btnRemover.className = 'btn-remover';
                btnRemover.onclick = () => {
                    imagensSelecionadas.splice(index, 1);
                    atualizarInterface();
                };

                wrapper.appendChild(img);
                wrapper.appendChild(btnRemover);
                previewContainer.appendChild(wrapper);
            });
        }

        function renderizarResultados(dados, acao) {
            resultadoContainer.innerHTML = "";
            const tipoSelecionado = selectTipo.value;
            const limiteDistancia = tipoSelecionado === 'rosto' ? '0.68' : '0.40';

            dados.resultados.forEach(res => {
                const divItem = document.createElement('div');
                divItem.classList.add('resultado-item');

                if (res.status === "sucesso") {
                    divItem.classList.add('sucesso');
                    if (acao === 'reconhecer') {
                        divItem.innerHTML = `
                            <div class="resultado-header">✅ Elemento Identificado</div>
                            <strong>Arquivo:</strong> ${res.arquivo} <br>
                            <strong>Usuário Correspondente:</strong> <span class="highlight-text">${res.nome_identificado}</span> <br>
                            <small>Métrica de Distância: <strong>${res.distancia.toFixed(4)}</strong> (Limiar da API: ${limiteDistancia})</small>
                        `;
                    } else {
                        divItem.innerHTML = `
                            <div class="resultado-header">✅ Cadastro Concluído</div>
                            <strong>Arquivo:</strong> ${res.arquivo} <br>
                            <strong>Status:</strong> ${res.mensagem || 'Salvo no banco de dados com sucesso.'}
                        `;
                    }
                } else if (res.status === "erro") {
                    divItem.classList.add('erro');
                    divItem.innerHTML = `
                        <div class="resultado-header">⚠️ Erro Operacional</div>
                        <strong>Arquivo:</strong> ${res.arquivo} <br>
                        <strong>Detalhe:</strong> ${res.mensagem}
                    `;
                } else {
                    divItem.classList.add('falha');
                    const razao = res.mensagem || "Sem correspondência no banco vetorial.";
                    divItem.innerHTML = `
                        <div class="resultado-header">❓ Não Reconhecido</div>
                        <strong>Arquivo:</strong> ${res.arquivo} <br>
                        <strong>Resultado:</strong> ${razao}
                    `;
                }

                resultadoContainer.appendChild(divItem);
            });
        }

        btnCadastrar.addEventListener('click', async () => {
            const identificador = inputIdentificador.value.trim();
            
            if (!identificador || !/^[a-zA-Z0-9_]+$/.test(identificador)) {
                alert("Por favor, digite um nome válido (apenas letras, números e underscores, sem espaços)!");
                inputIdentificador.focus();
                return;
            }

            const tipo = selectTipo.value;
            const endpoint = tipo === 'rosto' ? '/api/cadastrar' : '/api/cadastrar-tatuagem';

            btnCadastrar.disabled = true;
            btnAnalisar.disabled = true;
            btnCadastrar.innerHTML = "⏳ Cadastrando...";
            resultadoContainer.innerHTML = `<p class='loading-text'>Cadastrando elemento (${tipo})... por favor, aguarde.</p>`;

            const formData = new FormData();
            formData.append('nome', identificador);
            imagensSelecionadas.forEach(arquivo => formData.append('files', arquivo));

            try {
                const resposta = await fetch(`${BASE_URL}${endpoint}`, { 
                    method: 'POST', 
                    body: formData,
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });

                if (!resposta.ok) {
                    const erroJson = await resposta.json().catch(() => null);
                    throw new Error(erroJson?.detail || `Erro HTTP ${resposta.status}`);
                }

                const dados = await resposta.json();
                renderizarResultados(dados, 'cadastrar');
                
                inputIdentificador.value = '';
                imagensSelecionadas = [];
                atualizarInterface();

            } catch (erro) {
                console.error(erro);
                resultadoContainer.innerHTML = `<div class="resultado-item erro"><div class="resultado-header">❌ Erro de conexão</div>${erro.message}</div>`;
            } finally {
                btnCadastrar.innerHTML = "➕ Cadastrar Imagem";
                atualizarInterface(); 
            }
        });

        btnAnalisar.addEventListener('click', async () => {
            const tipo = selectTipo.value;
            const endpoint = tipo === 'rosto' ? '/api/reconhecer' : '/api/reconhecer-tatuagem';

            btnAnalisar.disabled = true;
            btnCadastrar.disabled = true;
            btnAnalisar.innerHTML = "⏳ Processando...";
            resultadoContainer.innerHTML = `<p class='loading-text'>Analisando características de ${tipo} no ChromaDB... aguarde.</p>`;

            const formData = new FormData();
            imagensSelecionadas.forEach(arquivo => formData.append('files', arquivo));

            try {
                const resposta = await fetch(`${BASE_URL}${endpoint}`, { 
                    method: 'POST', 
                    body: formData,
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });

                if (!resposta.ok) {
                    const erroJson = await resposta.json().catch(() => null);
                    throw new Error(erroJson?.detail || `Erro HTTP ${resposta.status}`);
                }

                const dados = await resposta.json();
                renderizarResultados(dados, 'reconhecer');

            } catch (erro) {
                console.error(erro);
                resultadoContainer.innerHTML = `<div class="resultado-item erro"><div class="resultado-header">❌ Erro de conexão</div>${erro.message}</div>`;
            } finally {
                btnAnalisar.innerHTML = "🔍 Reconhecer Imagem";
                atualizarInterface(); 
            }
        });

        atualizarInterface();
    </script>
</body>
</html>
